networks:
  shared:

volumes:
  volume-pnpm-store: # Persist package manager cache
  volume-npm-cache: # Persist npm/npx cache for @latest CLIs
  volume-convex-auth: # Persist Convex authentication
  volume-t3-home: # Persist T3 home directory
  volume-codex-home: # Persist Codex auth/config/history
  volume-opencode-data: # Opencode auth/db/worktrees
  volume-opencode-config: # Opencode global config
