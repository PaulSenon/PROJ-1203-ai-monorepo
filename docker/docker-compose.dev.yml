services:
  app:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.devEnv
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ../:/app:delegated # Source code mounting
      - volume-pnpm-store:/app/.pnpm-store # Package cache persistence
      - volume-npm-cache:/root/.npm # npx/npm cache for latest CLI downloads
      - volume-convex-auth:/root/.convex
      - volume-t3-home:/root/.t3 # T3 home: state db, worktrees, logs, attachments
      - volume-codex-home:/root/.codex # Codex auth/config/history via CODEX_HOME
      - volume-opencode-data:/root/.local/share/opencode
      - volume-opencode-config:/root/.config/opencode
      - ${HOME}/.config/opencode/opencode.jsonc:/root/.config/opencode/opencode.jsonc:ro
      - ${HOME}/.local/share/opencode/mcp-auth.json:/root/.local/share/opencode/mcp-auth.json:ro
      - ${HOME}/.local/share/opencode/auth.json:/root/.local/share/opencode/auth.json:ro
      - ${HOME}/.alchemy:/root/.alchemy:ro

    working_dir: /app
    ports:
      - "3000:3000" # apps/server
      - "3001:3001" # apps/web
      - "3773:3773" # t3 remote web/app server
      - "8888:8888" # vite bundler analyzer
      - "4096:4096" # opencode web ui port (hard codded in makefile)
    env_file:
      - ./.env.local
    command: pnpm dev
    networks: [shared]
  #   depends_on:
  #     - convex

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://app:3001
    networks: [shared]
